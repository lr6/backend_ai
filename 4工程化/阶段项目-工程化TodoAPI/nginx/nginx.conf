# ============================================================
# Task 4 · 阶段项目 Nginx 配置
#
# 静态文件 + SPA 回退 / 反向代理（剥 /api 前缀）/ 请求头透传 / upstream 轮询
#
# 验证（在项目目录下）：
#     ../../.venv/bin/python nginx/check.py
#
# 语法检查：
#     nginx -t -p "$PWD/nginx" -c "$PWD/nginx/nginx.conf"
# ============================================================

worker_processes 1;

pid runtime/nginx.pid;
error_log runtime/error.log warn;

events {
    worker_connections 256;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log runtime/access.log;

    # 两个后端实例，默认轮询。
    # upstream 必须写在 http 块里（写在 server 块里会报错）。
    upstream todo_api {
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
    }

    server {
        listen 8088;
        server_name localhost;

        # 静态文件根目录（相对 -p 前缀 → nginx/static）
        root static;

        # API 反向代理。
        # proxy_pass 末尾的 / 会把 location 前缀 /api/ 替换掉：
        #   /api/auth/login → 后端收到 /auth/login
        # 去掉末尾的 / 则会原样转发：/api/auth/login → /api/auth/login
        location /api/ {
            proxy_pass http://todo_api/;

            # 三件套：后端拿到的必须是客户端信息，不是 nginx 到后端的连接信息
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SPA 回退（Vue Router history 模式）：
        # 真实文件 → 目录 → 都找不到才回 index.html，由前端路由接管。
        # 注意 /api/ 的请求走上面的 location，不会落到这里。
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
