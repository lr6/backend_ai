# ============================================================
# 第 19 项 Nginx · 练习配置（已完成）
#
# 覆盖：静态文件 + SPA 回退 / 反向代理 / 请求头透传 /
#       负载均衡 / location 匹配优先级
#
# 自动测试：python check.py
# 语法检查：nginx -t -p "$PWD" -c "$PWD/nginx.conf"
# ============================================================

worker_processes 1;

pid /Users/zhibo/zhibo/backend_ai/4工程化/19Nginx/runtime/nginx.pid;
error_log /Users/zhibo/zhibo/backend_ai/4工程化/19Nginx/runtime/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /Users/zhibo/zhibo/backend_ai/4工程化/19Nginx/runtime/access.log;

    # 两个 uvicorn 实例，默认轮询
    upstream todo_cluster {
        server 127.0.0.1:8000;
        server 127.0.0.1:8001;
    }

    server {
        listen 8080;
        server_name localhost;

        # 静态文件 + SPA 回退（Vue Router history 模式）
        location / {
            root /Users/zhibo/zhibo/backend_ai/4工程化/19Nginx/static;
            try_files $uri $uri/ /index.html;
        }

        # 反向代理：剥掉 /api/ 前缀 + 透传真实客户端信息
        location /api/ {
            proxy_pass http://todo_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # location 匹配优先级演示
        location = /health {
            return 200 "exact";
        }

        location ^~ /img/ {
            return 200 "caret_tilde";
        }

        location ~* \.(png|jpg)$ {
            return 200 "regex";
        }
    }
}
