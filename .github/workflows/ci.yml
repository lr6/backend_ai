# ============================================================
# 第 20 项 CI/CD · GitHub Actions
#
# 触发 → test job（lint + 27 个测试）→ deploy job（演示）
# ============================================================

name: CI

# ------------------------------------------------------------
# 1. 触发条件
# ------------------------------------------------------------
on:
  push:
    branches: [master]      # 只有 push 到 master 才触发
  pull_request:             # 任何 PR 都触发
  workflow_dispatch:        # Actions 页面可手动点「Run workflow」

# ------------------------------------------------------------
# 2. 任务（job）
# ------------------------------------------------------------
jobs:
  test:
    runs-on: ubuntu-latest  # GitHub 提供的临时 Linux 机器
    steps:
      # runner 是空机器，先拉代码
      - uses: actions/checkout@v4

      # 装 Python 3.12 并加入 PATH
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 多行脚本用 run: |（竖线表示下面是整段 shell）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi pydantic ruff

      # lint 放在测试前面：语法错就快速失败，不用等测试跑完
      - name: Lint
        run: |
          ruff check --select E9,F63,F7,F82 \
            "4工程化/17pytest" "4工程化/18httpx-pytest"

      - name: Test
        run: python -m pytest "4工程化/17pytest" "4工程化/18httpx-pytest" -q

  deploy:
    needs: test             # test 成功才轮到它
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy (dry run)
        run: |
          echo "deploy to ${{ secrets.DEPLOY_HOST }} as ${{ secrets.DEPLOY_USER }}"
