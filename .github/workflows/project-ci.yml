# ============================================================
# 阶段项目 · 工程化 Todo API — CI
#
# 真实运行环境：GitHub 临时 Linux VM
#   1. 起两个 service 容器：PostgreSQL 16 + Redis 7
#   2. lint（ruff）快速失败
#   3. 跑 32 个 pytest 集成测试
#
# 和 ci.yml 的区别：
#   ci.yml 只跑纯 pytest 练习（无外部依赖）
#   这里需要真实的 PG / Redis，靠 services 提供
# ============================================================

name: CI · Todo API

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # 项目在中文目录里，steps 默认都在这个目录下执行
    defaults:
      run:
        working-directory: "4工程化/阶段项目-工程化TodoAPI"

    # --------------------------------------------------------
    # services：GitHub 帮你起的附属容器，和 job 的 runner 在同一网络
    # localhost:5432 / localhost:6379 直接可连
    # options 里的 health 检查：容器「活着但没就绪」不算好，等健康才开始跑 steps
    # --------------------------------------------------------
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eng_todo_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest.py 里是 setdefault，这里设置的值优先于本地默认值
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/eng_todo_test_db
      REDIS_URL: redis://127.0.0.1:6379/14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "4工程化/阶段项目-工程化TodoAPI/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      # lint 放测试前面：语法错误 / 未定义名字 立刻失败，不用等 30 秒测试
      - name: Lint
        run: ruff check --select E9,F63,F7,F82,F401 .

      # conftest 会自己 create_all 建表，不需要 alembic
      - name: Test
        run: python -m pytest tests -q
